# This workflow has never run. It starts only by hand, from the Actions tab.
# The owner does not pay for CI runs yet. Put the `push` and `pull_request` triggers
# back (`on: [push, pull_request]`) when the owner agrees to the cost.
name: verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra lint
      - run: uv run --extra lint ruff check .
      - run: uv run pytest -q
      - run: uv run catalog verify --skip compiled
